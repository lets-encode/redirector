<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Let's Encode!{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 4rem auto;
           padding: 0 1rem; line-height: 1.5; color: #222; }
    h1 { font-size: 1.5rem; }
    form { margin: 1.5rem 0; }
    input[type=text] { font-size: 1rem; padding: .5rem; width: 14rem; }
    button, .button { font-size: 1rem; padding: .5rem 1rem; cursor: pointer;
             background: #1a5fb4; color: #fff; border: none; border-radius: 4px;
             text-decoration: none; display: inline-block; }
    .error { color: #a51d2d; background: #fdecec; padding: .5rem .75rem;
             border-radius: 4px; }
    .muted { color: #666; font-size: .9rem; }
    code { background: #f2f2f2; padding: 0 .25rem; border-radius: 3px; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
<p class="muted">Let's Encode! — a citizen-science project.</p>
</body>
</html>
