<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Let's Encode!{% endblock %}</title>
  <meta name="description" content="{% block description %}Start or find an encoding campaign on Let's Encode! — a citizen-science project for crowd-encoding music scores.{% endblock %}">

  <meta name="color-scheme" content="light dark">
  <script>
    // Theme: a saved choice (from the bulb toggle) wins; otherwise follow the
    // machine's colour-scheme setting. Runs before first paint so there's no
    // wrong-theme flash. Only the user's explicit pick is stored, under a single
    // localStorage key — a functional preference, no tracking. Mirrors the main
    // Let's Encode! site so a theme chosen there carries over (same origin).
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) {}
      var dark = stored
        ? stored === "dark"
        : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      var theme = dark ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/redirector.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Let's Encode! — home"><span class="brand-logo" title="Let's Encode! Crowd-encoding and validation of music scores"><img class="brand-logo-img brand-logo-rest" src="/assets/logos/lets-encode-nav.png" alt="" width="1120" height="400"><img class="brand-logo-img brand-logo-rest-dark" src="/assets/logos/lets-encode-cream.png" alt="" width="1120" height="400"><img class="brand-logo-img brand-logo-hover" src="/assets/logo.svg" alt="" width="1391" height="400"><img class="brand-logo-img brand-logo-hover-dark" src="/assets/logo-dark.svg" alt="" width="1391" height="400"></span><span class="brand-text" aria-hidden="true">Let's Encode!</span></a>
    <div class="topbar-right">
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Toggle light / dark theme">
        <svg class="bulb" viewBox="-2 -2 28 28" width="22" height="22" aria-hidden="true" focusable="false">
          <g class="bulb-rays" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="12" y1="-1.8" x2="12" y2="2"/>
            <line x1="21.8" y1="2.2" x2="18.9" y2="5.1"/>
            <line x1="2.2" y1="2.2" x2="5.1" y2="5.1"/>
            <line x1="24.6" y1="11" x2="20.8" y2="11"/>
            <line x1="-0.6" y1="11" x2="3.2" y2="11"/>
          </g>
          <path class="bulb-glass" d="M12 2.6a6.2 6.2 0 0 0-3.8 11.1c.75.58 1.25 1.4 1.35 2.35h4.9c.1-.95.6-1.77 1.35-2.35A6.2 6.2 0 0 0 12 2.6Z"/>
          <path class="bulb-filament" d="M10 12.7 12 10l2 2.7"/>
          <g class="bulb-base" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none">
            <path d="M9.6 16.2v1.6h4.8v-1.6"/>
            <line x1="10.4" y1="20" x2="13.6" y2="20"/>
          </g>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="main" class="re-shell hero">
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <span class="footer-left">Let's Encode! — a citizen-science project for the crowd-encoding of music scores.</span>
  </div>
</footer>

<script>
  // Light/dark bulb toggle. Applies the theme, reflects it on the button for
  // assistive tech, and stores only the user's explicit choice.
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector(".theme-toggle");
    if (!btn) return;
    function stored() {
      try { return localStorage.getItem("theme"); } catch (e) { return null; }
    }
    function apply(theme) {
      root.dataset.theme = theme;
      root.style.colorScheme = theme;
      var dark = theme === "dark";
      btn.setAttribute("aria-pressed", dark ? "true" : "false");
      btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    }
    apply(root.dataset.theme || "light");
    btn.addEventListener("click", function () {
      var next = root.dataset.theme === "dark" ? "light" : "dark";
      apply(next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
    if (window.matchMedia) {
      var mq = matchMedia("(prefers-color-scheme: dark)");
      var onChange = function (e) {
        if (!stored()) apply(e.matches ? "dark" : "light"); // system change only matters pre-choice
      };
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  })();
</script>
</body>
</html>
