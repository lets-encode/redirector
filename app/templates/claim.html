{% extends "base.html" %}
{% block title %}Claim “{{ name }}” — Let's Encode!{% endblock %}
{% block body %}
<div class="panel">
  <h1>There's no campaign called “{{ name }}” yet</h1>
  <p>Would you like to start one? It will live at
     <span class="slug">letsenco.de/{{ name }}</span>.</p>
  <div class="actions">
    <a class="btn btn-primary" href="{{ campaign_start_url }}">Start “{{ name }}”</a>
    <a class="btn btn-ghost" href="/">Pick a different name</a>
  </div>
</div>
{% endblock %}
